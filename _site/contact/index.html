<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nishank Gite</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      color: #333;
      background-color: #f4f4f4;
    }

    header {
      background-color: #0077b6;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
    }

    nav a:hover {
      background-color: #023e8a;
      transition: 0.3s;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      color: #0077b6;
      margin-bottom: 40px;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
      font-size: 1.1em;
    }

    ul li {
      margin-bottom: 20px;
    }

    ul li strong {
      color: #0077b6;
    }

    ul a {
      color: #0077b6;
      text-decoration: none;
    }

    ul a:hover {
      text-decoration: underline;
    }

    form {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
    }

    label {
      margin-bottom: 10px;
      font-weight: 500;
    }

    input, textarea {
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
    }

    button {
      padding: 10px 20px;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1.1em;
      cursor: pointer;
    }

    button:hover {
      background-color: #023e8a;
      transition: 0.3s;
    }

    footer {
      background-color: #0077b6;
      color: white;
      text-align: center;
      padding: 15px 0;
      position: relative;
      bottom: 0;
      width: 100%;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <main>
    <h2 id="contact">Contact Me</h2>

    <ul>
      <li><strong>Email</strong>: <a href="mailto:nishankgite@berkeley.edu">nishankgite@berkeley.edu</a></li>
      <li><strong>LinkedIn</strong>: <a href="https://www.linkedin.com/in/nishank-g-997b13132/">Nishank Gite</a></li>
      <li><strong>GitHub</strong>: <a href="https://github.com/afinitus">afinitus</a></li>
    </ul>

    <h2>Send me a message</h2>
    <form action="https://formspree.io/f/xeojddok" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="_replyto" required>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2024 Nishank Gite</p>
  </footer>
</body>

</html>
